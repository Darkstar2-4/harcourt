[package]
name = "hxweb"
version = "0.2.0"
edition = "2021"

[lib]
name = "hxweb"
path = "src/lib.rs"

[[bin]]
name = "hxweb"
path = "src/main.rs"

[[bin]]
name = "hx-import"
path = "src/bin/hx-import.rs"
required-features = ["import"]

[[bin]]
name = "hx-diff"
path = "src/bin/hx-diff.rs"

[features]
import = ["sqlx/mysql", "dep:futures-util"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
dns-lookup = "2"
form_urlencoded = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
rust_decimal = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
similar = "2"
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
